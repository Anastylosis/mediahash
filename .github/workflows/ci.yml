name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Anastylosis/.github/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
      checks: write
      # Required unconditionally. The shared workflow's test job
      # declares id-token: write for Codecov's OIDC auth, and a reusable
      # workflow cannot request more than its caller grants — without this the
      # run fails at startup, before a single step executes.
      id-token: write
    secrets: inherit
    with:
      # A library, not a command: there is nothing to install or cross-compile,
      # so binary-name only satisfies the input and cross-build just proves the
      # package still compiles for each target.
      binary-name: mediahash
      main-package: .
      # videophash shells out to ffmpeg, so the pipeline's behavior varies by
      # OS in exactly the ways a pure library's would not; the ffmpeg-gated
      # tests run wherever the runner image ships the binaries and skip
      # where it does not.
      platform-tests: true
      # Everything runs on local files and local subprocesses — no test may
      # touch the network, and CI proves it.
      offline-isolation: true
